# Parameter der Gesamtrechnung, Fassung des Gesamtkonzepts vom 6. Oktober 2026 (v3.12).
# parameter.toml bleibt die Parameterbasis der Fassung vom 4. Oktober (Regression gegen die
# Originalskripte in modell/rahmen/). Hier stehen nur Werte, die sich durch Prüfung oder Entscheidung
# geändert haben, und die Regeln, nach denen abgeleitet wird. Alle übrigen Eingänge liest
# modell/gesamtrechnung.py aus modell/rahmen/basis.py (Eurostat 2024) und daten/aggregate/.

[modell]
version = "v3.49"
fassung = "12. Oktober 2026"

[[parameter]]
name       = "auslauf_beginn_jahr"
wert       = 2024
einheit    = "Jahr"
bezugsjahr = 2024
preisbasis = "keine"
quelle     = "Entscheidung B6 (v3.12)"
status     = "entscheidung"
hinweis    = "Der effektive Zins von 2024 ist ein Stand von 2024; der Altbestand wird seit 2024 zu Marktsätzen ersetzt. Das Auslaufen beginnt daher 2024, nicht 2028 (vorsichtige Lesart, Abschnitt 8 des Konzepts)"

