soli_mrd = 12.9                          # BMF 2025, enthält Soli auf Körperschaft- und Kapitalertragsteuer
beamte_mio = 1.9                         # Annahme (Personalstandstatistik, Größenordnung) – für die Lohnsumme ergänzt
beamte_brutto = 58000                    # Annahme, 2025
