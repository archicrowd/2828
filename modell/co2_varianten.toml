name = "K1 + nationale Abgabe auf frei zugeteilte Mengen (100 €/t)"
[[variante]]
id = "K3"
name = "K2 mit 150 €/t"
preis = 150.0
[[variante]]
id = "K4"
name = "K2 mit 200 €/t"
preis = 200.0
[[variante]]
id = "K5"
name = "K2 + Landwirtschaft (Methan, Lachgas) mit 100 €/t"
