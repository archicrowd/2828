# Mehrwertsteuer nach Einkommen: Verteilung der Mehrbelastung auf die Haushalte (modell/mwst_verteilung.py, Logbuch v4.29). Prüfrechnung, DE.
# Anlass: Punkt R2. Die Haushaltsrechnungen setzten den effektiven Satz (18,84 % neu gegen 15,97 % heute, je auf den steuerpflichtigen Konsum)
# auf den ganzen Konsum, also auch auf Miete, Gesundheit, Bildung und Versicherungen (steuerfrei), und für alle Einkommen gleich.
version = "v4.29"
# geltende Variante: "mit_vorsteuer" = sichtbare Steuer nach Güterstruktur je Einkommensklasse + Rest gleichmäßig je Euro Konsum
# (Vorsteuer in steuerfreien Bereichen, Wohnungsbau, Annahme), Durchschnitt wie bisher; "sichtbar" = nur sichtbare Steuer (untere Schranke der
# Belastung); "einheitlich" = bisherige Rechnung (Faktor 1).
variante = "mit_vorsteuer"

