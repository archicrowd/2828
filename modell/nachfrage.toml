# Nachfrageprüfung (modell/nachfrage.py, Logbuch v3.31). Alle Größen mit Quelle und Status; Bandbreiten statt Punktwerte.
version = "v3.31"
konsum_anteil_bip = 0.52        # Konsum der privaten Haushalte, Anteil am BIP, Größenordnung EU (Annahme, nicht abgerufen)

# Kanal 1: Umverteilung von oben nach unten und Nettoentlastung
# Umfang der Umverteilung zwischen Haushalten (% des BIP): kein Klub-Verteilungsmodell vorhanden, daher Szenarien (Annahme).
umverteilung_pct_bip = [2.0, 4.0, 6.0]
# Abstand der Konsumneigung unten gegen oben: 0,1 (HFCS, 22 Länder, Albacete/Fessler/Pekanov, SUERF) bis 0,3
# (Italien, Jappelli/Pistaferri 2014, AEJ Macro 6(4)); Durchschnittsneigungen Q1 130 % / Q5 56 % (Eurostat icw_sr_10, keine MPC).
mpc_abstand = [0.1, 0.3]
# Konsumneigung aus der Nettoentlastung insgesamt: 0,2 (nicht-dauerhafte Güter, Christelis u. a. 2020) bis 0,5 (HFCS, inkl. Gebrauchsgüter)
mpc_entlastung = [0.2, 0.5]
# Importanteil des Konsums: Frankreich 18,7 % (Insee Première 1756, 2015); Euroraum Güter 51 %, Dienste 13 % (EZB 2024). Mittel 0,20 (Annahme).
importanteil = 0.20
# Abschlag durch Geldpolitik und Angebotsgrenzen: 0 (Nullzinsgrenze) bis 0,5 (Klub als großer Teil des Euroraums, EZB gleicht teilweise aus; Annahme)
