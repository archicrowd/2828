# Kanal 2: Angebot (aus modell/anreize.py): Niveaueffekt klubweit, bisher nicht eingerechnet. Nur als Obergrenze ausgewiesen.

# Kanal 3: Mehrwertsteuer-Label nach Produktgruppen
