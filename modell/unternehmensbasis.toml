[verluste]   # E4, Beschluss der Initiative 15.11.2026: Verlustvorträge beim Systemwechsel befristen (v4.89)
# Regel: Verlustvorträge, die Ende 2027 bestehen, sind fünf Jahre nutzbar (2028–2032), unter der neuen Mindestbesteuerung (H3: 1 Mio. € voll,
# darüber 50 %); danach verfallen sie. Verluste aus dem neuen System: unbefristet vortragbar mit derselben Mindestbesteuerung. Der Pfad
# misst gegen die Nutzung nach H3, damit H3 nicht doppelt zählt. Vorbild für die Frist: fünf Jahre in BG, HR, CY, CZ, GR, HU, PL, RO, SK (Tax Foundation 2024).
