# Systemvarianten 25:25 (Viertellösung) und 33:33 (Drittellösung) gegen 28:28 (modell/systemvarianten.py, Logbuch v3.43).
# Auftrag der Initiative vom 17.10.2026. Status: Prüfrechnung, keine Entscheidung; die Gesamtrechnung bleibt bei 28:28.
version = "v3.43"

# Gemeinsame Regel aller Varianten: Spitzensatz s gilt für Einkommen (oberste Stufe), Kapitalerträge, Unternehmensgewinne, Erbschaften und
# die oberste Stufe des Mehrwertsteuer-Labels. Die übrigen Sätze werden im Verhältnis s/28 skaliert (Setzung, „alle Steuerwerte auf die Zielmarke“),
# gerundet auf ganze Prozent. Stufen am Grundbedarf (1 / 1,5 / 2 / 3) und alle übrigen Positionen (Vermögen 1,5 %, CO2, Grundstücksabgabe,
# Subventionsabbau, übrige Steuern) bleiben unverändert.

[[system]]
id = "28"
name = "28:28 (geltend)"
spitzensatz = 28
einkommen_saetze = [0, 9, 16, 21, 28]
label_saetze = [5, 11, 17, 22, 28]
# Dividende: Mindestniveau = Anteil am Bezugswert. Bezugswert „grundbedarf“ = steuerliches Existenzminimum (12.348 € 2026);
# „grundbedarf_sozial“ = Grundbedarf zuzüglich Sozialabdeckung je Kopf (Gesundheit GF07 + Seil), Vorschlag vom 16.10.2026.
mindestniveau_anteil = 0.50
bezugswert = "grundbedarf"
# Was aus Steuern finanziert wird (zusätzlich zu Dach, Gemeinden, Dividende)
steuer_traegt = ["haertefall"]

[[system]]
id = "25"
name = "25:25 (Viertellösung)"
spitzensatz = 25
einkommen_saetze = [0, 8, 14, 19, 25]
label_saetze = [4, 10, 15, 20, 25]
mindestniveau_anteil = 0.25
bezugswert = "grundbedarf_sozial"
steuer_traegt = ["haertefall"]

[[system]]
id = "33"
name = "33:33 (Drittellösung)"
spitzensatz = 33
einkommen_saetze = [0, 11, 19, 25, 33]
label_saetze = [6, 13, 20, 26, 33]
mindestniveau_anteil = 0.50
bezugswert = "grundbedarf"
# Sozialabgaben inkludiert: Gesundheit, Seil (Invalidität, Hinterbliebene, Lohnersatz bei Arbeitslosigkeit) und Zugesagtes Z aus Steuern
steuer_traegt = ["haertefall", "gesundheit", "seil", "z"]

[annahmen]
haertefall_pct_bip = 0.65        # Mitte der Spanne 0,3–1,0 (sozialschutz.toml, ANNAHME, ohne Quelle)
verhalten = "Kapital, Unternehmen, Erbschaft und Label statisch proportional (keine Ausweichreaktion); Einkommen mit der Elastizität des Kernmodells"

# ---- v3.44 (Initiative 17.10.2026): Altlasten aus Staatsschulden (Zinsdienst) und Rentenansprüchen (Z) werden außerhalb finanziert;
# Dividende als Bruchteil des Existenzminimums einschließlich Sozialabdeckung. Vergleich aller Marken unter derselben Regel.
[[system]]
id = "28A"
name = "28:28, Altlasten außerhalb"
spitzensatz = 28
einkommen_saetze = [0, 9, 16, 21, 28]
label_saetze = [5, 11, 17, 22, 28]
mindestniveau_anteil = 0.50
bezugswert = "grundbedarf"
steuer_traegt = ["haertefall"]
zins_ausserhalb = true

[[system]]
id = "25A"
name = "25:25 (Viertel), Altlasten außerhalb"
spitzensatz = 25
einkommen_saetze = [0, 8, 14, 19, 25]
label_saetze = [4, 10, 15, 20, 25]
mindestniveau_anteil = 0.25
bezugswert = "grundbedarf_sozial"
steuer_traegt = ["haertefall"]
zins_ausserhalb = true

[[system]]
id = "33A"
name = "33:33 (Drittel), Dividende 1/3 von Grundbedarf + Sozialabdeckung, Gesundheit und Seil aus Steuern, Altlasten außerhalb"
spitzensatz = 33
einkommen_saetze = [0, 11, 19, 25, 33]
label_saetze = [6, 13, 20, 26, 33]
mindestniveau_anteil = 0.3333333
bezugswert = "grundbedarf_sozial"
steuer_traegt = ["haertefall", "gesundheit", "seil"]
zins_ausserhalb = true

[[system]]
id = "33G"
name = "33:33 (Drittel), Dividende 1/3 des Grundbedarfs, Gesundheit und Seil aus Steuern, Altlasten außerhalb"
spitzensatz = 33
einkommen_saetze = [0, 11, 19, 25, 33]
label_saetze = [6, 13, 20, 26, 33]
mindestniveau_anteil = 0.3333333
bezugswert = "grundbedarf"
steuer_traegt = ["haertefall", "gesundheit", "seil"]
zins_ausserhalb = true

# Lösungskandidat (v3.44): Drittel mit Seil und dem gemeinsamen Teil der Gesundheit (Kinder, Prävention, Hochkostenpool), so bemessen, dass ein
# Überschuss von rund 0,2 Punkten bleibt (wie in der Gesamtrechnung 28:28); übrige Gesundheit als Prämie mit Belastungsgrenze.
[[system]]
id = "33L"
name = "33:33 Lösung: Dividende 1/3 von Grundbedarf + Sozialabdeckung, Seil und 30 % der Gesundheit aus Steuern, Altlasten außerhalb"
spitzensatz = 33
einkommen_saetze = [0, 11, 19, 25, 33]
label_saetze = [6, 13, 20, 26, 33]
mindestniveau_anteil = 0.3333333
bezugswert = "grundbedarf_sozial"
steuer_traegt = ["haertefall", "gesundheit", "seil"]
gesundheit_anteil = 0.30
zins_ausserhalb = true

# ---- v3.45 (Initiative 17.10.2026): 33 % Mehrwertsteuer nur für die ganz schädlichen Produkte, kein Regelfall. Label bleibt 5/11/17/22/28;
# eine Sonderstufe 33 % gilt nur für Alkohol und Tabak (Setzung; in den Produktgruppen von nachfrage.toml die einzige Gruppe dieser Art).
# Fahrzeuge und Kraftstoffe bleiben bei 28 %. Prämienfreie Lösung: Gesundheit und Seil ganz aus Steuern, Mindestniveau so bemessen,
# dass ein Überschuss von 0,2 Punkten bleibt.
[[system]]
id = "33M"
name = "33:33 mit Prämie: Label 5–28, nur Alkohol/Tabak 33; Seil und 30 % Gesundheit aus Steuern; Dividende ⅓ von Grundbedarf + Sozialabdeckung"
spitzensatz = 33
einkommen_saetze = [0, 11, 19, 25, 33]
label_saetze = [5, 11, 17, 22, 28]
label_sonder = { alkohol_tabak = 33 }
mindestniveau_anteil = 0.3333333
bezugswert = "grundbedarf_sozial"
steuer_traegt = ["haertefall", "gesundheit", "seil"]
gesundheit_anteil = 0.30
zins_ausserhalb = true

[[system]]
id = "33P"
name = "33:33 prämienfrei: Label 5–28, nur Alkohol/Tabak 33; Gesundheit und Seil ganz aus Steuern; Dividende so bemessen, dass +0,2 bleibt"
spitzensatz = 33
einkommen_saetze = [0, 11, 19, 25, 33]
label_saetze = [5, 11, 17, 22, 28]
label_sonder = { alkohol_tabak = 33 }
mindestniveau_anteil = 0.25
loese_saldo = 0.2
bezugswert = "grundbedarf"
steuer_traegt = ["haertefall", "gesundheit", "seil"]
gesundheit_anteil = 1.0
zins_ausserhalb = true

[[system]]
id = "33N"
name = "33:33 mit Prämie, ausgeglichen: wie 33M, Dividende so bemessen, dass +0,2 bleibt"
spitzensatz = 33
einkommen_saetze = [0, 11, 19, 25, 33]
label_saetze = [5, 11, 17, 22, 28]
label_sonder = { alkohol_tabak = 33 }
mindestniveau_anteil = 0.3
loese_saldo = 0.2
bezugswert = "grundbedarf_sozial"
steuer_traegt = ["haertefall", "gesundheit", "seil"]
gesundheit_anteil = 0.30
zins_ausserhalb = true

# ---- v3.46 (Beschlüsse der Initiative 17.10.2026): prämienfrei; Sonderstufe 33 % für umwelt- und gesundheitsschädliche Produkte.
# Zuordnung in den Produktgruppen von nachfrage.toml (Setzung): Alkohol und Tabak 33 %; Kraftstoffe 33 %; Fahrzeuge 32 % als Mischsatz
# (Annahme: 80 % der Fahrzeugausgaben entfallen auf Fahrzeuge mit Verbrennungsmotor einschließlich Hybride, 20 % auf andere; nicht geprüft).
# Haushaltsenergie bleibt bei 22 % (Grundbedarf Wärme; fossile Anteile trägt der CO2-Preis). Nachfragerückgang durch den höheren Satz nicht eingerechnet.
[[system]]
id = "33F"
name = "33:33 prämienfrei (Beschluss): Label 5–28, Sonderstufe 33 % für umwelt- und gesundheitsschädliche Produkte; Gesundheit und Seil aus Steuern"
spitzensatz = 33
einkommen_saetze = [0, 11, 19, 25, 33]
label_saetze = [5, 11, 17, 22, 28]
label_sonder = { alkohol_tabak = 33, kraftstoffe = 33, fahrzeuge = 32 }
mindestniveau_anteil = 0.25
loese_saldo = 0.2
bezugswert = "grundbedarf"
steuer_traegt = ["haertefall", "gesundheit", "seil"]
gesundheit_anteil = 1.0
zins_ausserhalb = true
