# Altlastenfonds (modell/altlasten.py, Logbuch v3.45/v3.46). Setzungen und Varianten; Prüfrechnung.
version = "v3.48"
systeme = ["33R", "33F"]          # v3.48: 33R (Label 5/11/17/25 + Sonderstufe) geltender Beschluss; 33F zum Vergleich          # 33F: Beschluss vom 17.10.2026 (prämienfrei, Sonderstufe für schädliche Produkte); 33P zum Vergleich
# Anteil der Altrenten über der Dividende (Z), der in den Fonds eingeht. Beschluss: anlagegedeckte Ansprüche voll, der Rest zur Hälfte, die andere
# Hälfte der Verhandlung der Generationen unterworfen. Die staatlichen Systeme der Tabelle 29 (nasa_10_pens1) sind praktisch ungedeckt
# (S13PU = Summe der staatlichen Systeme, Abweichung höchstens 1 Punkt), anlagegedeckt also ≈ 0; Rücklagen der Rentenversicherung und
# Versorgungsrücklagen sind klein und hier nicht beziffert (Annahme). Varianten 0,75 und 1,0: wenn die Verhandlung mehr zuspricht.
z_anteil = [1.0, 0.5]            # v3.47: keine Halbierung (1,0 geltend); 0,5 nur zum Vergleich
zins = [2.5, 3.0]                 # Zins des Fonds in %: Garantiezins der Gesamtrechnung; 3,0 = nominales Wachstum (Risikofall)
# Zieljahr und Ziel-Schuldenquote. Beschluss: Streckung höchstens 70 Jahre, also bis 2098 vollständig getilgt (0 %); zum Vergleich 60 % bis 2098.
ziele = [[2098, 0.0], [2098, 60.0]]
deckel = [100.0, 120.0]           # Variante: gleichbleibender Beitrag, sodass die Schuldenquote des Fonds diesen Wert nie übersteigt
tilgungsregel = "Einnahmen über dem gleitenden Fünfjahresdurchschnitt des Aufkommens (% des BIP) fließen vollständig in die Tilgung des Fonds; in schwachen Jahren bleibt der Beitrag gleich, keine zusätzliche Tilgung. Setzung, nicht modelliert."

# v3.48 (Beschluss): Renten um die eingesparten Sozialbeiträge der Rentner gekürzt. Satz: Kranken- und Pflegeversicherung der Rentner in
# Deutschland 2026: 7,3 % + halber durchschnittlicher Zusatzbeitrag 1,45 % + Pflege 3,6 % = 12,35 % der Bruttorente (Annahme: für alle zehn Staaten
# gleich; tatsächlich unterschiedlich, z. B. Frankreich CSG/CRDS, Dänemark keine Beiträge – je Staat zu setzen).
kuerzung = 0.075            # v4.11 (Beschluss 18.10.2026, Rentnerausgleich A): 7,5 % statt 12,35 %

[beschluss]
system = "33R"
z_anteil = 1.0
zins = 2.5
zieljahr = 2098
zielquote = 0.0
verrechnung_jahre = 30            # Verrechnung je Staat schmilzt linear in 30 Jahren ab, wie der Aufschlag für die Altschulden im Konzept
