# Satz und Puffer für eine auf Dauer leicht steigende Dividende (modell/quote_optimum.py, Logbuch v4.100). Prüfrechnung, ändert die geltende Rechnung nicht.
# Auftrag der Initiative vom 18.11.2026: „Die Ausgabenteilung ist in gutem Verhältnis, das Aufkommen zu gering. Wo läge die perfekte Quote mit
# Puffer und auf Dauer eher leicht steigender Dividende?“
version = "v4.101"   # Korrektur 95 (Netz-Rückwirkung)
saetze = [33.333333, 35.0, 36.0, 37.0, 38.0, 40.0]   # einheitlicher Satz (Spitze Einkommen, Kapital, Unternehmen, Erbschaft; Label je Variante)
puffer_pct_bip = 0.5          # Ausgleichsrücklage je Jahr (Annahme; geltend 0,23 als Saldo)
staatsebene_pct_bip = 1.2     # Empfindlichkeit: Verwaltung der Staatsebene, Lücke gegen EU-27 (struktur_vergleich.json, v4.99)
# Fonds: Barwertgleiche Konstante der Lenkungsabgaben bis zum Zieljahr des Fonds; nach 2060 bleibt die Lenkung auf dem Wert 2060 (Annahme)
fonds_zins = 0.0245           # fonds_geltend.json
fonds_zieljahr = 2098
wachstum_nominal = 0.03       # parameter.toml wachstum_nominal (3 %)
# Verhalten (Kernmodell, Szenario Robust): Einkommen über eti 0,35 (im Aufkommen enthalten); Kapitalerträge ((1−t)/(1−t0))^0,8;
# Unternehmen exp(−1,0 × Δ Punkte / 100); Erbschaft exp(−Δ Punkte / 100); Label ohne Verhaltensreaktion (Annahme)
# Glättung: Dividende wächst real um g je Jahr; Überschuss früher Jahre in eine Rücklage (ohne Zins). g = 0,5 % und 1 % (Annahme, BIP je Kopf real rund 1 %)
glaettung_wachstum = [0.005, 0.01]
kriterium = "Dividende in Kaufkraft 2026: ab 2035 in keinem Jahr fallend und 2060 nicht unter 2028"
